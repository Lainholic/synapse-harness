name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTHONIOENCODING: utf-8

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Unit Tests
      run: |
        python tests/test_harness.py

    - name: Run Self Verification
      run: |
        python scripts/verify.py scripts/verify.py
        python scripts/verify.py scripts/model_sanitizer.py
        python scripts/verify.py SKILL.md
        python scripts/verify.py README.md
        python scripts/verify.py README.ko.md
